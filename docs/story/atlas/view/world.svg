<svg width="1600" height="1114" id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="世界図・既知の範囲" viewBox="-700 -550 2800 1950" style="font-family: &quot;Yu Gothic UI&quot;, Meiryo, sans-serif;"><title>STARLIT GUILD / 地図帳 / 世界図・既知の範囲</title><desc>存在は本文・設定資料を参照。すべての座標と地形の輪郭は制作案です。方角・実距離・移動時間を確定する地図ではありません。 世界全体に対する暫定配置。国・大陸・海岸線は未設定。枠の外へ世界を広げられます。</desc><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="#637a6510" stroke-width="1"></path></pattern><pattern id="forest-pattern" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 4 23 L 10 10 L 16 23 M 9 17 L 10 14 L 12 17 M 19 10 L 23 1 L 27 10" fill="none" stroke="#6e876e" stroke-width="0.9" opacity="0.5"></path></pattern><pattern id="mountain-pattern" width="52" height="36" patternUnits="userSpaceOnUse"><path d="M 2 31 L 18 5 L 34 31 M 18 5 L 20 20 L 26 28 M 30 31 L 40 15 L 50 31" fill="none" stroke="#948a70" stroke-width="1.1" opacity="0.65"></path></pattern></defs><rect x="-700" y="-550" width="2800" height="1950" fill="#eee8d5"></rect><rect x="-700" y="-550" width="2800" height="1950" fill="url(#grid)"></rect><polygon points="210,370 330,390 400,450 360,565 205,560 180,465" fill="#e8e3bd" stroke="#c9c69e" stroke-width="3.7333333333333334" stroke-dasharray="18.666666666666668 18.666666666666668"><title>リンデ周辺の畑の広がり（案） · 制作案
1-4の畑を参考に配置。耕地の境界は未設定。</title></polygon><polygon points="100,130 200,105 300,145 325,240 260,300 130,285 80,220" fill="#d6debd" stroke="#9cae8a" stroke-width="3.7333333333333334" stroke-dasharray="18.666666666666668 18.666666666666668"><title>湿地を含む森の広がり（案） · 制作案
第一章の森と湿地を参考にした輪郭案。</title></polygon><polygon points="100,130 200,105 300,145 325,240 260,300 130,285 80,220" fill="url(#forest-pattern)" pointer-events="none"></polygon><polygon points="445,285 540,290 590,355 545,410 455,400 415,340" fill="#d6debd" stroke="#9cae8a" stroke-width="3.7333333333333334" stroke-dasharray="18.666666666666668 18.666666666666668"><title>月光の林の広がり（案） · 制作案
第二章の林。湿地の森とは独立した配置案。</title></polygon><polygon points="445,285 540,290 590,355 545,410 455,400 415,340" fill="url(#forest-pattern)" pointer-events="none"></polygon><polygon points="440,70 540,60 650,70 765,80 845,150 825,240 740,280 650,255 590,205 510,190 430,150" fill="#ded7bb" stroke="#b6ab88" stroke-width="3.7333333333333334" stroke-dasharray="18.666666666666668 18.666666666666668"><title>山越えの地形（案） · 制作案
第二章の山道を支える山地の位置と輪郭案。正式な山脈名なし。</title></polygon><polygon points="440,70 540,60 650,70 765,80 845,150 825,240 740,280 650,255 590,205 510,190 430,150" fill="url(#mountain-pattern)" pointer-events="none"></polygon><polyline points="990,205 1020,255 1005,310 1020,360 1050,420 1060,490" fill="none" stroke="#90b3b3" stroke-width="18.666666666666668" stroke-linejoin="round" stroke-linecap="round"><title>ベルネと屋敷を隔てる川（流路案） · 制作案
川を渡る関係は第三章の既存設定。描画した流路・流向・源流・河口は未設定。</title></polyline><polygon points="810,545 890,535 990,580 1010,650 960,700 860,690 820,625" fill="#d6debd" stroke="#9cae8a" stroke-width="3.7333333333333334" stroke-dasharray="18.666666666666668 18.666666666666668"><title>ブレッカの塔周辺の植生（案） · 制作案
第四章の塔の裏手の植生の配置案。苔床の敷地を確定しない。</title></polygon><polygon points="810,545 890,535 990,580 1010,650 960,700 860,690 820,625" fill="url(#forest-pattern)" pointer-events="none"></polygon><polygon points="560,635 635,610 700,640 790,740 760,810 600,805 545,730" fill="#e8e3bd" stroke="#c9c69e" stroke-width="3.7333333333333334" stroke-dasharray="18.666666666666668 18.666666666666668"><title>町の周辺の開けた土地（案） · 制作案
醸造の町の周辺を開けた土地として描く案。原料の産地は未設定。</title></polygon><polyline points="400,490 900,350" fill="none" stroke="#f8f1df" stroke-width="22.4" stroke-linejoin="round"></polyline><polyline points="400,490 900,350" fill="none" stroke="#a8784c" stroke-width="7.466666666666667" stroke-dasharray="22.4 14.933333333333334" stroke-linejoin="round"><title>ベルネへの往診の道 · 接続: 既存設定
