name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Run lint
        run: npm run lint

      - name: Check generated story videos
        run: npm run videos:check

      - name: Test story video pipeline
        run: node --test tests/story-videos.test.mjs

      - name: Check generated scenery images
        run: npm run images:check

      - name: Test quest navigation and image pipeline
        run: node --test tests/quest-navigation.test.mjs tests/quest-picker.test.mjs tests/scenery-images.test.mjs
