name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Check formatting
        run: npm run format:check

      - name: Check manual test inventory
        run: npm run manual-tests:check

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Check generated story videos
        run: npm run videos:check

      - name: Check generated scenery images
        run: npm run images:check

      - name: Check generated road art
        run: npm run road-art:check

      - name: Check generated story stills and album thumbnails
        run: npm run stills:check

      - name: Check generated social card image
        run: npm run social-card:check

      - name: Check generated BGM
        run: npm run music:check

      - name: Check generated game script
        run: npm run script:check

      - name: Run unit tests
        run: node --test tests/*.test.mjs
