name: PR version

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate PR version policy
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-version.mjs --base-ref "${{ github.event.pull_request.base.sha }}"
