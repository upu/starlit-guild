name: Temporary version bump

on:
  push:
    branches:
      - codex/compact-adventure-actions

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compact-adventure-actions
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Bump patch version and remove temporary workflow
        run: |
          npm version patch --no-git-tag-version
          git rm .github/workflows/temp-version-bump.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump game version"
          git push origin HEAD:codex/compact-adventure-actions
