name: Verify idle banter fix

on:
  push:
    branches: [codex/fix-idle-banter]
    paths:
      - app/story-scenes.tsx
      - tests/story-reader.test.mjs
      - .github/workflows/verify-idle-banter.yml

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      head: ${{ steps.version.outputs.head }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - id: version
        name: Bump this fix to 0.1.4
        run: |
          current=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if [ "$current" = "0.1.3" ]; then
            npm run version:patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m 'chore: bump patch version for idle banter fix'
            git push origin HEAD:refs/heads/codex/fix-idle-banter
          elif [ "$current" != "0.1.4" ]; then
            echo "Unexpected version: $current" >&2
            exit 1
          fi
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm run install:ci
      - name: Regression tests
        id: tests
        continue-on-error: true
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Type check
        id: types
        continue-on-error: true
        run: npx --no-install tsc --noEmit
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Check all results
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          printf 'tests=%s types=%s lint=%s build=%s\n' "$TESTS" "$TYPES" "$LINT" "$BUILD"
          test "$TESTS" = success && test "$TYPES" = success && test "$LINT" = success && test "$BUILD" = success
