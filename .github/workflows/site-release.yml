name: Site release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Validate separate site targets
        run: node scripts/check-site-release.mjs --config
      - name: Test release guards
        run: node --test tests/site-release.test.mjs
